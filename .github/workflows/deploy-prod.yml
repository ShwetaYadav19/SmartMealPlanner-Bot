name: Deploy Prod

on:
  push:
    branches: [prod]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Build & Deploy
        env:
          STAGE: prod
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID_PROD }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN_PROD }}
          TWILIO_SENDER_NUMBER: ${{ secrets.TWILIO_SENDER_NUMBER_PROD }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID_PROD }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET_PROD }}
          RAZORPAY_PLAN_ID: ${{ secrets.RAZORPAY_PLAN_ID_PROD }}
        run: |
          npm run build
          node scripts/deploy.js
